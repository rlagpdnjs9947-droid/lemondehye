<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수능 학습 플래너</title>
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>수능 학습 플래너</h1>
    <p class="subtitle">공부할 양을 입력하면 D-day까지 남은 날짜에 맞춰 하루 분량을 자동으로 짜드려요.</p>
  </header>

  <section class="card" id="dday-card">
    <div class="dday-row">
      <div class="dday-number" id="dday-number">D-?</div>
      <div class="dday-info">
        <label for="exam-date">수능일</label>
        <input type="date" id="exam-date">
      </div>
    </div>
  </section>

  <section class="card">
    <h2>과목별 학습량</h2>
    <p class="section-hint">과목마다 문제집을 여러 권 추가할 수 있어요. 목록 순서대로(1권을 다 풀면 2권으로) 진행돼요. ▲▼ 버튼으로 순서를 바꿀 수 있어요.</p>
    <div id="subject-list" class="subject-list"></div>
    <button id="add-subject" class="btn secondary" type="button">+ 과목 추가</button>
    <button id="generate-plan" class="btn primary" type="button">계획 생성 / 재계산</button>
  </section>

  <section class="card" id="summary-card" hidden>
    <h2>진행 요약</h2>
    <div id="progress-list" class="progress-list"></div>
  </section>

  <section class="card" id="plan-card" hidden>
    <div class="plan-header">
      <h2>일일 계획표</h2>
      <div class="plan-toggle">
        <button id="show-upcoming" class="btn toggle active" type="button">앞으로 14일</button>
        <button id="show-all" class="btn toggle" type="button">전체 보기</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="plan-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <p id="empty-message" class="empty-message">수능일과 과목별 학습량을 입력한 뒤 "계획 생성"을 눌러주세요.</p>
</div>

<script src="js/app.js?v=3"></script>
</body>
</html>
